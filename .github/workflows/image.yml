name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 运行阶段要 apk add，需要 QEMU；Go 本身是交叉编译，不走模拟
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # PR 只验证能否构建，不推镜像
      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hangbiao
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # 每次构建都去查 ACL4SSR 的最新提交，把它钉进生成的 rule-provider URL；
      # 查不到就回退到 internal/scheme/revision.go 里的兜底 revision，不阻断构建。
      - name: 解析 ACL4SSR 最新 revision
        id: acl4ssr
        run: |
          set -eu
          rev="$(python3 scripts/acl4ssr_revision.py)" || rev=""
          if [ -n "$rev" ]; then
            echo "ACL4SSR revision: $rev"
          else
            echo "::warning::查不到 ACL4SSR 最新 revision，使用代码内置兜底值"
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.acl4ssr.outputs.rev }}
          build-args: |
            ACL4SSR_REV=${{ steps.acl4ssr.outputs.rev }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
